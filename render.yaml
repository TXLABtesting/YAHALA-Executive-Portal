# Render blueprint: managed PostgreSQL plus the portal container, both on
# Render's free tier. Connect the repository at
# https://dashboard.render.com/blueprints and Render builds the Dockerfile,
# provisions the database and wires DATABASE_URL in.
#
# Two limits of the free tier, neither of which needs a code change:
#   - A free database is removed after 30 days. To keep the portal running past
#     that, either upgrade the database in the Render dashboard, or point
#     DATABASE_URL at a permanently free host (Neon, Supabase) — see the
#     "Deploying" section of README.md.
#   - A free web service sleeps after 15 minutes with no traffic and takes
#     roughly a minute to answer the next request.

databases:
  - name: yahala-db
    databaseName: yahala
    user: yahala
    plan: free

services:
  - type: web
    name: yahala-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Uploaded files live in the database, so the instance needs no disk.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yahala-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set this in the Render dashboard before the first deploy.
      - key: ADMIN_PASSWORD
        sync: false
