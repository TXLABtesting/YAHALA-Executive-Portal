# Render blueprint: managed PostgreSQL plus the portal container.
# Connect the repository at https://dashboard.render.com/blueprints and Render
# builds the Dockerfile, provisions the database and wires DATABASE_URL in.

databases:
  - name: yahala-db
    databaseName: yahala
    user: yahala
    plan: basic-256mb

services:
  - type: web
    name: yahala-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Uploaded files live in the database, so the instance needs no disk.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yahala-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # Set this in the Render dashboard before the first deploy.
      - key: ADMIN_PASSWORD
        sync: false
